<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Autumn Cache Forage | Flier Entry</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f0e6;color:#173d2b}.entry-wrap{max-width:570px;margin:8vh auto;padding:32px;background:white;border-radius:16px;box-shadow:0 10px 35px #173d2b18}.entry-wrap label{display:block;margin:20px 0 8px;font-weight:700}.entry-wrap input{display:block;width:100%;padding:13px;border:1px solid #9aa89b;border-radius:7px;font:inherit}.entry-wrap button{margin-top:20px;background:#173d2b;color:white;border:0;border-radius:8px;padding:14px 24px;cursor:pointer;font:inherit}.entry-wrap button:disabled{opacity:.5}#status{margin-top:18px} [hidden]{display:none!important}</style></head><body><main class="entry-wrap"><p class="eyebrow">Milwaukee Sylvestral Conservation Foundation</p><h1>Autumn Cache Forage</h1><p>Found a numbered field flier? Enter its serial number below to check your entry.</p><form id="serial-form"><label for="serial">Flier serial number</label><input id="serial" name="serial" inputmode="numeric" pattern="[0-9]{1,20}" maxlength="20" autocomplete="off" required><button type="submit">Check serial number</button></form><form id="winner-form" action="https://formsubmit.co/milwaukeescfoundation@gmail.com" method="POST" hidden><input type="hidden" name="_subject" value="Autumn Cache Forage — winning flier claim"><input type="hidden" name="_captcha" value="true"><input type="hidden" name="_template" value="table"><input type="hidden" name="winning_serial" id="winning-serial" value=""><h2>Winning serial number!</h2><p>Enter your contact information so the foundation can follow up about your prize. Keep your original flier for verification.</p><label for="winner-name">Full name</label><input id="winner-name" name="name" maxlength="120" autocomplete="name" required><label for="winner-email">Email address</label><input id="winner-email" name="email" type="email" maxlength="254" autocomplete="email" required><button type="submit">Submit winner information</button></form><p id="status" role="status" aria-live="polite"></p></main><script src="cache-entry.js" defer></script></body></html>
